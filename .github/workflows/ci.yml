name: CI/CD

# Every push: all tests (unit, PostgreSQL, mobile, integration and Playwright end-to-end against Docker Compose).
# Every commit to main that passes: publish the image to GHCR and redeploy (#114). Deploy jobs run only when
# their configuration exists (repository variables), so forks and branches never try to deploy.

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/240103175-rgb/retrace

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    name: Unit tests (Node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Validate OpenAPI contract
        run: npm run validate:api
      - name: Backend tests with coverage (memory + SQLite, contract, access, persistence)
        run: npm run test:coverage -w backend
      - name: Frontend tests
        run: npm test -w frontend
      - name: Frontend typecheck and build
        run: npm run build
      - name: Smoke test against the running server
        run: |
          STORAGE=memory PORT=3200 npm start > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3200/api/v1/health && break; sleep 1; done
          npm run smoke -w backend -- http://localhost:3200 || (cat server.log; exit 1)

  postgres:
    # #29 #107 the same service, feature, migration and API tests on PostgreSQL.
    runs-on: ubuntu-latest
    name: PostgreSQL 16
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: retrace
          POSTGRES_PASSWORD: retrace
          POSTGRES_DB: retrace_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U retrace" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Backend tests on PostgreSQL (incl. SQLite → PostgreSQL migration)
        run: npm run test:postgres -w backend
        env:
          TEST_DATABASE_URL: postgres://retrace:retrace@localhost:5432/retrace_test

  mobile:
    # #28 the Expo app type-checks against the shared web API client and bundles for iOS and Android.
    runs-on: ubuntu-latest
    name: Mobile (Expo)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: mobile
      - run: npm run typecheck
        working-directory: mobile
      - run: npm test
        working-directory: mobile
      - run: npm run bundle
        working-directory: mobile
        env:
          CI: 1

  infra:
    # #112 #113 deployment templates are valid before anyone applies them.
    runs-on: ubuntu-latest
    name: Infrastructure templates
    steps:
      - uses: actions/checkout@v4
      - name: Lint CloudFormation
        run: pip install --quiet cfn-lint && cfn-lint deploy/aws/retrace-stack.yaml
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform fmt and validate
        working-directory: deploy/gcp
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      - name: Production compose file is valid
        run: POSTGRES_PASSWORD=x ADMIN_PASSWORD=x docker compose -f deploy/compose.prod.yaml config --quiet

  stack:
    # #106 #108 #109 #110 the real image and Docker Compose stack, tested end to end.
    runs-on: ubuntu-latest
    name: Docker Compose — integration + Playwright e2e
    env:
      ADMIN_PASSWORD: ci-admin-password-123
      # Every e2e spec posts from the same address.
      PUBLIC_REPORT_LIMIT: 1000
      PUBLIC_CHECK_LIMIT: 1000
      POSTGRES_PASSWORD: ci-postgres-password
      BASE_URL: http://localhost:3200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the image and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Image runs as a non-root user and reports PostgreSQL
        run: |
          test "$(docker compose exec -T app id -u)" != "0"
          curl -sf $BASE_URL/api/v1/health | tee /dev/stderr | grep -q '"storage":"sql:postgres"'
          docker compose ps
      - name: Smoke test
        run: npm run smoke -w backend -- $BASE_URL
      - name: Integration tests
        run: npm run test:integration
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (Playwright, one spec per feature)
        run: npm run e2e
      - name: Restart the stack; data must survive
        run: |
          docker compose down
          docker compose up --detach --wait --wait-timeout 120
          RESTARTED=1 npm run test:integration
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -n 300
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  publish:
    # Only main, only after every test job passed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [unit, postgres, mobile, infra, stack]
    runs-on: ubuntu-latest
    name: Publish image to GHCR
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy-render:
    # #111 Render builds the same Dockerfile; triggered by its deploy hook (secret) after the tests.
    needs: publish
    if: vars.RENDER_URL != ''
    runs-on: ubuntu-latest
    name: Deploy to Render
    environment:
      name: render
      url: ${{ vars.RENDER_URL }}
    steps:
      - name: Trigger deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          test -n "$HOOK" || { echo "RENDER_DEPLOY_HOOK_URL secret is missing"; exit 1; }
          curl -fsS -X POST "$HOOK" > /dev/null
      - name: Wait for the new version and check health
        run: |
          for i in $(seq 1 60); do
            body=$(curl -fsS "${{ vars.RENDER_URL }}/api/v1/health" || true)
            echo "$body"
            echo "$body" | grep -q '"status":"ok"' && exit 0
            sleep 15
          done
          exit 1

  deploy-aws:
    # #112 OIDC role (no access keys) → SSM runs `docker compose pull && up` on the instance.
    needs: publish
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    name: Deploy to AWS
    permissions:
      id-token: write
      contents: read
    environment:
      name: aws
      url: ${{ vars.AWS_URL }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Pull and restart on the instance
        run: |
          id=$(aws ssm send-command --instance-ids "${{ vars.AWS_INSTANCE_ID }}" --document-name AWS-RunShellScript \
            --parameters 'commands=["cd /opt/retrace","docker compose pull app","docker compose up -d","docker image prune -f"]' \
            --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$id" --instance-id "${{ vars.AWS_INSTANCE_ID }}"
      - name: Health check
        run: |
          for i in $(seq 1 30); do curl -fsS "${{ vars.AWS_URL }}/api/v1/health" && exit 0; sleep 10; done
          exit 1

  deploy-gcp:
    # #113 Workload Identity Federation (no key files) → IAP SSH runs the same pull + restart.
    needs: publish
    if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
    runs-on: ubuntu-latest
    name: Deploy to Google Cloud
    permissions:
      id-token: write
      contents: read
    environment:
      name: gcp
      url: ${{ vars.GCP_URL }}
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Pull and restart on the VM
        run: |
          gcloud compute ssh retrace --zone "${{ vars.GCP_ZONE }}" --tunnel-through-iap --quiet \
            --command "cd /opt/retrace && sudo docker compose pull app && sudo docker compose up -d && sudo docker image prune -f"
      - name: Health check
        run: |
          for i in $(seq 1 30); do curl -fsS "${{ vars.GCP_URL }}/api/v1/health" && exit 0; sleep 10; done
          exit 1
