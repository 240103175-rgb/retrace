name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    name: Node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Validate OpenAPI contract
        run: npm run validate:api
      - name: Backend tests with coverage (memory + SQLite, contract, access, persistence)
        run: npm run test:coverage -w backend
      - name: Frontend tests
        run: npm test -w frontend
      - name: Frontend typecheck and build
        run: npm run build
      - name: Smoke test against the running server
        run: |
          STORAGE=memory PORT=3200 npm start > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3200/api/v1/health && break; sleep 1; done
          npm run smoke -w backend -- http://localhost:3200 || (cat server.log; exit 1)

  postgres:
    # #29 the same service, feature and API tests on PostgreSQL, then a smoke run of the server on it.
    runs-on: ubuntu-latest
    name: PostgreSQL 16
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: retrace
          POSTGRES_PASSWORD: retrace
          POSTGRES_DB: retrace_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U retrace" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: retrace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Backend tests on PostgreSQL
        run: npm run test:postgres -w backend
        env:
          TEST_DATABASE_URL: postgres://retrace:retrace@localhost:5432/retrace_test
      - name: Build
        run: npm run build
      - name: Smoke test with DATABASE_URL on PostgreSQL
        run: |
          psql -h localhost -U retrace -d retrace_test -c 'CREATE DATABASE retrace_app'
          DATABASE_URL=postgres://retrace:retrace@localhost:5432/retrace_app PORT=3200 npm start > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3200/api/v1/health && break; sleep 1; done
          npm run smoke -w backend -- http://localhost:3200 || (cat server.log; exit 1)
          grep -q 'sql:postgres' <(curl -s http://localhost:3200/api/v1/health) || (curl -s http://localhost:3200/api/v1/health; exit 1)
