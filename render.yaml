# Render Blueprint (#111): the repository's Dockerfile as a web service + a managed PostgreSQL, both on free plans.
# New → Blueprint → pick this repository. Render asks for ADMIN_PASSWORD (sync: false = not stored here).
services:
  - type: web
    name: retrace
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    autoDeploy: false # deploys come from CI after all tests pass (deploy hook)
    envVars:
      - key: NODE_ENV
        value: production
      - key: SEED_DEMO
        value: 'true'
      - key: TRUST_PROXY
        value: '1'
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: retrace-db
          property: connectionString

databases:
  - name: retrace-db
    plan: free
    databaseName: retrace
    user: retrace
